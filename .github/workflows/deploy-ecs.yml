name: Publicar API no ECS

on:
  workflow_call:
    inputs:
      api:
        description: mobile, web, nosql ou ia
        required: true
        type: string
      aws-account-id:
        description: Conta AWS que recebera o deploy
        required: true
        type: string
      aws-region:
        default: us-east-1
        type: string
      ecs-cluster:
        default: cluster-fixa
        type: string
      task-definition:
        description: Revisao opcional para aplicar configuracoes criadas pelo Terraform
        default: ''
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ecs-${{ inputs.aws-account-id }}-${{ inputs.ecs-cluster }}-${{ inputs.api }}
      cancel-in-progress: false
    env:
      API: ${{ inputs.api }}
      AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
      AWS_REGION: ${{ inputs.aws-region }}
      ECS_CLUSTER: ${{ inputs.ecs-cluster }}
      CONFIG_TASK_DEFINITION: ${{ inputs.task-definition }}
      AWS_PAGER: ''
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '5'
    steps:
      - name: Obter o commit da API que chamou o workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Definir destino e imagem
        shell: bash
        run: |
          set -euo pipefail
          case "$API:$GITHUB_REPOSITORY" in
            mobile:Fixa-Inter/segundo-api-app|web:Fixa-Inter/segundo-api-web|nosql:Fixa-Inter/segundo-api-nosql|ia:Fixa-Inter/segundo-inteligencia-artificial) ;;
            *) echo 'API e repositorio nao correspondem.' >&2; exit 1 ;;
          esac
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" == us-east-1 ]]
          echo "ECR_REPOSITORY=fixa/$API-api" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=fixa-$API-api-service" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=fixa-$API-api" >> "$GITHUB_ENV"
          echo "REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Autenticar na AWS com a sessao do laboratorio
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Obter a configuracao do servico existente
        shell: bash
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          [[ "$account" == "$AWS_ACCOUNT_ID" ]] || {
            echo 'As credenciais pertencem a outra conta AWS.' >&2
            exit 1
          }
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > service.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('service.json').read_text())
          if result.get('failures') or len(result.get('services', [])) != 1:
              raise SystemExit('Servico ECS nao encontrado.')
          service = result['services'][0]
          if service['status'] != 'ACTIVE' or service['desiredCount'] < 1:
              raise SystemExit('O servico precisa estar ativo e com desiredCount maior que zero.')
          if service.get('deploymentController', {}).get('type', 'ECS') != 'ECS':
              raise SystemExit('Este workflow requer deployment controller ECS.')
          arn = os.environ['CONFIG_TASK_DEFINITION'] or service['taskDefinition']
          # Evita inserir linhas arbitrarias no arquivo de ambiente do runner.
          if '\n' in arn or '\r' in arn:
              raise SystemExit('Task Definition invalida.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SOURCE_TASK_DEFINITION={arn}\n')
          PY

      - name: Carregar a Task Definition de origem
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$SOURCE_TASK_DEFINITION" --include TAGS > current-task.json

      - name: Preparar a nova Task Definition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path('current-task.json').read_text())
          task = source['taskDefinition']
          if task['family'] != os.environ['CONTAINER_NAME']:
              raise SystemExit('Familia da Task Definition diferente da API selecionada.')
          containers = [c for c in task['containerDefinitions'] if c['name'] == os.environ['CONTAINER_NAME']]
          if len(containers) != 1:
              raise SystemExit('Container esperado nao encontrado de forma unica.')
          container = containers[0]
          if os.environ['API'] in ('mobile', 'web', 'nosql'):
              environment = {x['name']: x.get('value', '') for x in container.get('environment', [])}
              secrets = {x['name']: x.get('valueFrom', '') for x in container.get('secrets', [])}
              required = {'FIREBASE_CREDENTIALS_PATH', 'FIREBASE_S3_BUCKET', 'FIREBASE_S3_KEY',
                          'FIREBASE_S3_BUCKET_OWNER', 'FIREBASE_CREDENTIALS_SHA256', 'FIREBASE_PROJECT_ID'}
              missing = sorted(key for key in required if not environment.get(key) and not secrets.get(key))
              if missing:
                  raise SystemExit('Task Definition ' + os.environ['API'] + ' sem referencias Firebase: '
                                   + ', '.join(missing) + '. Aplique a configuracao Firebase pelo Terraform '
                                   + 'e informe essa revisao no input task-definition.')
              path = environment.get('FIREBASE_CREDENTIALS_PATH')
              if path and path != '/app/secrets/firebase.json':
                  raise SystemExit('FIREBASE_CREDENTIALS_PATH: configure /app/secrets/firebase.json')
              if environment.get('FIREBASE_CREDENTIALS_JSON') or secrets.get('FIREBASE_CREDENTIALS_JSON'):
                  raise SystemExit('Remova FIREBASE_CREDENTIALS_JSON; este runtime usa o arquivo privado no S3.')
              if not task.get('taskRoleArn'):
                  raise SystemExit('Task Definition sem Task Role para baixar a credencial do S3.')
              # Garante o inicializador mesmo se a revisao de origem sobrescrever o ENTRYPOINT.
              container['entryPoint'] = ['python3', '/usr/local/bin/fixa-firebase-entrypoint.py']
          # Campos aceitos por RegisterTaskDefinition; metadados de leitura ficam de fora.
          allowed = {'family', 'taskRoleArn', 'executionRoleArn', 'networkMode', 'containerDefinitions',
                     'volumes', 'placementConstraints', 'requiresCompatibilities', 'cpu', 'memory',
                     'pidMode', 'ipcMode', 'proxyConfiguration', 'inferenceAccelerators',
                     'ephemeralStorage', 'runtimePlatform', 'enableFaultInjection'}
          result = {k: v for k, v in task.items() if k in allowed}
          tags = [t for t in source.get('tags', []) if not t['key'].startswith('aws:')]
          if tags:
              result['tags'] = tags
          Path('task-definition.json').write_text(json.dumps(result))
          PY

      - name: Criar runtime Firebase compartilhado
        if: inputs.api == 'mobile' || inputs.api == 'web' || inputs.api == 'nosql'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/fixa-firebase.XXXXXX")
          cat > "$runtime_dir/Dockerfile" <<'DOCKERFILE'
          # Runtime Firebase compartilhado por mobile, web e nosql sobre a imagem Java original.
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          USER root
          RUN apk add --no-cache python3 py3-boto3 \
              && addgroup -S fixa \
              && adduser -S -G fixa fixa \
              && mkdir -p /app/secrets \
              && chown fixa:fixa /app/secrets \
              && chmod 700 /app/secrets
          COPY entrypoint.py /usr/local/bin/fixa-firebase-entrypoint.py
          USER fixa
          ENTRYPOINT ["python3", "/usr/local/bin/fixa-firebase-entrypoint.py"]
          CMD ["sh", "-c", "exec java -Dserver.port=${PORT:-8080} -jar /app/app.jar"]
          DOCKERFILE
          cat > "$runtime_dir/entrypoint.py" <<'PYTHON'
          """Baixa a credencial privada para disco efemero antes de iniciar o Java."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tempfile

          CREDENTIAL_PATH = '/app/secrets/firebase.json'
          MAX_BYTES = 128 * 1024


          def prepare_firebase(env, s3):
              path = env.get('FIREBASE_CREDENTIALS_PATH')
              if path != CREDENTIAL_PATH or env.get('FIREBASE_CREDENTIALS_JSON'):
                  raise RuntimeError('Configuracao Firebase incompativel')
              owner = env.get('FIREBASE_S3_BUCKET_OWNER', '')
              digest = env.get('FIREBASE_CREDENTIALS_SHA256', '')
              if not re.fullmatch(r'[0-9]{12}', owner) or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise RuntimeError('Identidade/checksum Firebase invalidos')
              bucket = env.get('FIREBASE_S3_BUCKET')
              key = env.get('FIREBASE_S3_KEY')
              if bucket != f'fixa-secrets-{owner}-us-east-1' or key != f'firebase/{digest}.json':
                  raise RuntimeError('Destino Firebase inesperado')
              response = s3.get_object(Bucket=bucket, Key=key, ExpectedBucketOwner=owner)
              body = response['Body']
              try:
                  raw = body.read(MAX_BYTES + 1)
              finally:
                  body.close()
              if len(raw) > MAX_BYTES or hashlib.sha256(raw).hexdigest() != digest:
                  raise RuntimeError('Integridade da credencial Firebase nao confirmada')
              data = json.loads(raw.decode('utf-8-sig'))
              if not isinstance(data,dict) or data.get('type') != 'service_account':
                  raise RuntimeError('Credencial Firebase invalida')
              for key in ('project_id','client_email','private_key'):
                  if not isinstance(data.get(key),str) or not data[key].strip():
                      raise RuntimeError('Credencial Firebase incompleta')
              if data['project_id'] != env.get('FIREBASE_PROJECT_ID'):
                  raise RuntimeError('Projeto Firebase divergente')
              if '-----BEGIN PRIVATE KEY-----' not in data['private_key'] or '-----END PRIVATE KEY-----' not in data['private_key']:
                  raise RuntimeError('Formato da credencial Firebase invalido')
              target = Path(path)
              target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
              target.parent.chmod(0o700)
              fd, temp = tempfile.mkstemp(dir=target.parent)
              try:
                  with os.fdopen(fd,'wb') as f:
                      f.write(raw)
                  os.replace(temp,target)
              finally:
                  if os.path.exists(temp):
                      os.unlink(temp)


          def main():
              os.umask(0o077)
              import boto3
              s3 = boto3.client('s3',region_name='us-east-1')
              prepare_firebase(os.environ,s3)
              print('[OK] Credencial Firebase preparada; iniciando API.',flush=True)
              if len(sys.argv) < 2:
                  raise RuntimeError('Comando Java ausente')
              os.execvp(sys.argv[1],sys.argv[1:])

          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  # Nem resposta S3, nem arquivo, nem excecoes do SDK sao enviados ao log.
                  print('[ERRO] Nao foi possivel preparar Firebase. Verifique arquivo, checksum e permissoes S3 da Task Role. API nao iniciada.',file=sys.stderr)
                  sys.exit(1)
          PYTHON
          cat > "$runtime_dir/.dockerignore" <<'DOCKERIGNORE'
          *
          !Dockerfile
          !entrypoint.py
          DOCKERIGNORE
          echo "FIREBASE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Construir e publicar a imagem
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if [[ "$API" == mobile || "$API" == web || "$API" == nosql ]]; then
            base_image="fixa-$API-build:$IMAGE_TAG"
            docker build --platform linux/amd64 -t "$base_image" .
            docker build --platform linux/amd64 \
              --build-arg "BASE_IMAGE=$base_image" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -t "$image" "$FIREBASE_RUNTIME_DIR"
          else
            docker build --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -t "$image" .
          fi
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "DEPLOY_IMAGE=$REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_ENV"

      - name: Associar a imagem publicada a Task Definition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('task-definition.json')
          task = json.loads(path.read_text())
          container = next(c for c in task['containerDefinitions'] if c['name'] == os.environ['CONTAINER_NAME'])
          container['image'] = os.environ['DEPLOY_IMAGE']
          path.write_text(json.dumps(task))
          PY

      - name: Implantar a nova revisao no ECS
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          [[ "$latest" == "$GITHUB_SHA" ]] || {
            echo 'Existe um commit mais recente na main; esta execucao antiga nao sera implantada.' >&2
            exit 1
          }
          arn=$(aws ecs register-task-definition --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "EXPECTED_TASK_DEFINITION=$arn" >> "$GITHUB_ENV"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$arn" --query 'service.serviceArn' --output text

      - name: Aguardar e confirmar a revisao publicada
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          expected = os.environ["EXPECTED_TASK_DEFINITION"]
          confirmed = False

          for attempt in range(1, 19):
              response = subprocess.check_output(
                  [
                      "aws", "ecs", "describe-services",
                      "--cluster", os.environ["ECS_CLUSTER"],
                      "--services", os.environ["ECS_SERVICE"],
                      "--output", "json",
                      "--no-cli-pager",
                  ],
                  text=True,
              )
              result = json.loads(response)

              if result.get("failures") or len(result.get("services", [])) != 1:
                  raise SystemExit("Servico nao encontrado depois do deploy.")

              service = result["services"][0]
              deployments = service.get("deployments", [])

              healthy = (
                  service["taskDefinition"] == expected
                  and service["desiredCount"] > 0
                  and service["runningCount"] == service["desiredCount"]
                  and service["pendingCount"] == 0
                  and len(deployments) == 1
                  and deployments[0]["taskDefinition"] == expected
                  and deployments[0].get("rolloutState") == "COMPLETED"
              )

              diagnostic = {
                  "tentativa": attempt,
                  "revisaoEsperada": expected,
                  "revisaoAtual": service["taskDefinition"],
                  "desired": service["desiredCount"],
                  "running": service["runningCount"],
                  "pending": service["pendingCount"],
                  "deployments": [
                      {
                          "revisao": deployment["taskDefinition"],
                          "estado": deployment.get("rolloutState"),
                          "motivo": deployment.get("rolloutStateReason"),
                      }
                      for deployment in deployments
                  ],
              }
              print(json.dumps(diagnostic, ensure_ascii=False), flush=True)

              if healthy:
                  confirmed = True
                  break

              if any(
                  deployment["taskDefinition"] == expected
                  and deployment.get("rolloutState") == "FAILED"
                  for deployment in deployments
              ):
                  raise SystemExit("O ECS marcou a revisao solicitada como FAILED.")

              if attempt < 18:
                  time.sleep(10)

          if not confirmed:
              raise SystemExit(
                  "A revisao solicitada nao concluiu o deploy no prazo. "
                  "Consulte o diagnostico acima e os eventos ECS."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(
                  f"### Deploy concluido: {os.environ['API']}\n\n"
                  f"Commit: `{os.environ['GITHUB_SHA']}`\n\n"
                  f"Imagem: `{os.environ['DEPLOY_IMAGE']}`\n\n"
                  f"Task Definition: `{expected}`\n"
              )
          PY

      - name: Mostrar eventos ECS em caso de falha
        if: failure() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[:10].[createdAt,message]' --output table